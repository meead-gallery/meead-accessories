name: One-time fix receipt upload

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix receipt upload via Supabase invoke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace receipt upload transport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('extracted/meead-project/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''  async attachReceipt(order, file, onProgress) {
  try {
    const fd = new FormData();
    fd.append("orderNumber", order.id);
    fd.append("phone", order.phone);
    fd.append("file", file);

    const xhr = new XMLHttpRequest();

    const result = await new Promise((resolve) => {
      xhr.open("POST", `${SUPABASE_URL}/functions/v1/upload-receipt`);
      xhr.setRequestHeader("apikey", SUPABASE_PUBLISHABLE_KEY);
      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable && onProgress) {
          const percent = Math.round(
            (event.loaded / event.total) * 100
          );
          onProgress(percent);
        }
      };

      xhr.onload = async () => {
        let data = {};

        try {
          data = JSON.parse(xhr.responseText || "{}");
        } catch (e) {}

        if (xhr.status < 200 || xhr.status >= 300 || data.ok === false) {
          resolve({
            ok: false,
            reason: data.reason || "آپلود رسید ناموفق بود",
          });
          return;
        }

        resolve({
          ok: true,
          order: {
            ...order,
            status:
              data.status || "در انتظار تأیید پرداخت",
            receiptPath:
              data.receiptPath ||
              order.receiptPath ||
              null,
          },
          orders: [],
        });
      };

      xhr.onerror = () => {
        resolve({
          ok: false,
          reason: "آپلود رسید ناموفق بود",
        });
      };

      xhr.send(fd);
    });

    return result;
  } catch (e) {
    return {
      ok: false,
      reason: "آپلود رسید ناموفق بود",
    };
  }
},'''

          new = '''  async attachReceipt(order, file, onProgress) {
  try {
    const fd = new FormData();
    fd.append("orderNumber", order.id);
    fd.append("phone", order.phone);
    fd.append("file", file);

    if (onProgress) onProgress(0);

    const { data, error } = await supabase.functions.invoke("upload-receipt", {
      body: fd,
    });

    if (error || data?.ok === false) {
      return {
        ok: false,
        reason: data?.reason || error?.message || "آپلود رسید ناموفق بود",
      };
    }

    if (onProgress) onProgress(100);

    return {
      ok: true,
      order: {
        ...order,
        status: data?.status || "در انتظار تأیید پرداخت",
        receiptPath: data?.receiptPath || order.receiptPath || null,
      },
      orders: [],
    };
  } catch (e) {
    console.error("Receipt upload error:", e);
    return {
      ok: false,
      reason: e?.message || "آپلود رسید ناموفق بود",
    };
  }
},'''

          if old not in text:
              raise SystemExit('Expected attachReceipt block was not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify only App.jsx changed
        run: |
          git diff --check
          git diff -- extracted/meead-project/src/App.jsx

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/meead-project/src/App.jsx .github/workflows/fix-receipt-upload.yml
          git commit -m "Fix receipt upload via Supabase invoke"
          git rm .github/workflows/fix-receipt-upload.yml
          git commit -m "Remove temporary receipt upload fix workflow"
          git push
