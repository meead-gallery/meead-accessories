name: Fix receipt upload request

on:
  push:
    paths:
      - '.github/workflows/fix-receipt-upload.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch receipt upload client
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('extracted/meead-project/src/App.jsx')
          s = p.read_text(encoding='utf-8')

          old = '''      xhr.open("POST", `${SUPABASE_URL}/functions/v1/upload-receipt`);

      xhr.upload.onprogress = (event) => {'''

          new = '''      xhr.open("POST", `${SUPABASE_URL}/functions/v1/upload-receipt`);

      // Supabase API key belongs in the apikey header.
      // If the customer has a Supabase session, also send that user JWT correctly.
      xhr.setRequestHeader("apikey", SUPABASE_PUBLISHABLE_KEY);

      try {
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData?.session?.access_token;
        if (accessToken) {
          xhr.setRequestHeader("Authorization", `Bearer ${accessToken}`);
        }
      } catch (e) {
        console.warn("Could not read Supabase session before receipt upload:", e);
      }

      xhr.upload.onprogress = (event) => {'''

          if old not in s:
              raise SystemExit('Target receipt-upload block was not found; no change made.')

          s2 = s.replace(old, new, 1)
          if s2 == s:
              raise SystemExit('Patch made no change.')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/meead-project/src/App.jsx
          git rm .github/workflows/fix-receipt-upload.yml
          git commit -m "Fix receipt upload authentication headers"
          git push
